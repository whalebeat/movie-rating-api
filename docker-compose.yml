version: '3.8'
services: 
   api: 
     build: . 
     ports: 
       - "8000:8000"
     volumes: 
       - ./models:/app/models 
     environment: 
       - MODEL_PATH=/app/models/svd_model.pkl 
     restart: unless-stopped
     healthcheck:
       test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
       interval: 30s
       timeout: 10s
       retries: 3